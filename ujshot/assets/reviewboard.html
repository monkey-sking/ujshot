  if (boardMode === "operate" || !currentImage || !sv.versions.length) {
    bar.style.display = "none";
    return;
  }
  bar.style.display = "flex";

  const leftSel = document.getElementById("leftVerSelect");
  const rightSel = document.getElementById("rightVerSelect");
  const rightWrap = document.getElementById("rightSelectWrap");
  const swapBtn = document.getElementById("swapVerBtn");
  const resetBtn = document.getElementById("resetAutoBtn");
  const hasMultiple = sv.versions.length >= 2;

  leftSel.innerHTML = "";
  rightSel.innerHTML = "";
  for (const v of sv.versions) {
    const o1 = document.createElement("option");
    o1.value = v.key;
    o1.textContent = v.label;
    if (sv.leftVer && v.key === sv.leftVer.key) o1.selected = true;
    leftSel.appendChild(o1);

    const o2 = document.createElement("option");
    o2.value = v.key;
    o2.textContent = v.label;
    if (sv.rightVer && v.key === sv.rightVer.key) o2.selected = true;
    rightSel.appendChild(o2);
  }
  if (!sv.rightVer && hasMultiple) {
    const emptyOpt = document.createElement("option");
    emptyOpt.value = "";
    emptyOpt.textContent = sv.missingRightBuild ? `Build ${sv.missingRightBuild}（缺图）` : "（无对比）";
    emptyOpt.selected = true;
    rightSel.insertBefore(emptyOpt, rightSel.firstChild);
  }

  rightWrap.style.display = (hasMultiple && stageViewMode !== "single") ? "inline-flex" : "none";
  swapBtn.style.display = (hasMultiple && sv.leftVer && sv.rightVer && stageViewMode !== "single") ? "inline-block" : "none";
  resetBtn.style.display = sv.isManual ? "inline-block" : "none";

  // 视图模式切换
  const viewSeg = document.getElementById("viewModeSeg");
  viewSeg.style.display = hasMultiple ? "inline-flex" : "none";
  const canCurtain = Boolean(sv.leftVer && sv.rightVer);
  document.getElementById("viewSideBtn").classList.toggle("active", stageViewMode === "side");
  const curtainBtn = document.getElementById("viewCurtainBtn");
  curtainBtn.classList.toggle("active", stageViewMode === "curtain");
  curtainBtn.disabled = !canCurtain;
  document.getElementById("viewSingleBtn").classList.toggle("active", stageViewMode === "single");

  const okBtn = document.getElementById("screenOkBtn");
  if (okBtn) {
    const ok = isScreenOk(currentImage);
    const upd = isScreenUpdated(currentImage);
    okBtn.classList.toggle("is-ok", ok);
    okBtn.classList.toggle("is-updated", upd);
    okBtn.textContent = ok ? "✓ 已确认无问题" : (upd ? "↻ 界面有更新 · 点此确认无问题" : "✓ 界面没问题");
  }

  // 版本时间轴：有 2 个及以上版本时展示
  const tl = document.getElementById("versionTimeline");
  if (sv.versions.length >= 2) {
    tl.style.display = "flex";
    tl.innerHTML = `<span class="tl-label">版本轴 (${sv.versions.length})</span>`;
    const imgAnns = state.annotations.filter(a => a.image === currentImage && appearanceOf(a) === currentAppearance);
    for (const v of sv.versions) {
      const isLeft = sv.leftVer && sv.leftVer.key === v.key;
      const isRight = sv.rightVer && sv.rightVer.key === v.key && stageViewMode !== "single";
      const issueCount = v.build
        ? imgAnns.filter(a => String(raisedInOf(a)) === String(v.build)).length
        : (v.isBefore ? imgAnns.filter(a => !raisedInOf(a)).length : 0);
      const btn = document.createElement("button");
      btn.className = "tl-node" + (isLeft && isRight ? " is-both" : (isLeft ? " is-left" : (isRight ? " is-right" : "")));
      btn.title = `${v.label}${issueCount ? ` · ${issueCount} 条批注` : ""}\n单击设为右侧对比图 · Shift/Alt+单击设为左侧基准图`;
      btn.innerHTML =
        (isLeft ? `<span class="tl-badge l">左</span>` : "")
        + (isRight ? `<span class="tl-badge r">右</span>` : "")
        + `<span>${esc(v.shortLabel)}</span>`
        + (issueCount ? `<span class="tl-dot" title="${issueCount} 条批注"></span>` : "");
      btn.onclick = (e) => {
        if (stageViewMode === "single" || e.shiftKey || e.altKey) {
          onLeftVerChange(v.key);
        } else {
          onRightVerChange(v.key);
        }
      };
      tl.appendChild(btn);
    }
  } else {
    tl.style.display = "none";
    tl.innerHTML = "";
  }
}

function render() {
  const darkCount = allImageNames("dark").length;
  const lightCount = allImageNames("light").length;
  const appDarkBtn = document.getElementById("appDarkBtn");
  const appLightBtn = document.getElementById("appLightBtn");
  if (appDarkBtn) {
    appDarkBtn.textContent = darkCount ? `🌙 暗色 ${darkCount}` : "🌙 暗色";
    appDarkBtn.classList.toggle("active", currentAppearance === "dark");
    appDarkBtn.classList.toggle("zero", darkCount === 0);
  }
  if (appLightBtn) {
    appLightBtn.textContent = lightCount ? `☀️ 亮色 ${lightCount}` : "☀️ 亮色";
    appLightBtn.classList.toggle("active", currentAppearance === "light");
    appLightBtn.classList.toggle("zero", lightCount === 0);
  }

  allNames = allImageNames(currentAppearance);
  const appAnns = state.annotations.filter(a => appearanceOf(a) === currentAppearance);
  const counts = {
    unreviewed: allNames.filter(n => isScreenUnreviewed(n, currentAppearance)).length,
    updated: allNames.filter(n => isScreenUpdated(n, currentAppearance)).length,
    open: appAnns.filter(a => bucketOf(a) === "open").length,
    proposed: appAnns.filter(a => bucketOf(a) === "proposed").length,
    approved: appAnns.filter(a => bucketOf(a) === "approved").length,
    fixed: appAnns.filter(a => bucketOf(a) === "fixed").length,
    accepted: appAnns.filter(a => bucketOf(a) === "accepted").length,
    rejected: appAnns.filter(a => bucketOf(a) === "rejected").length,
    discussed: appAnns.filter(a => bucketOf(a) === "discussed").length,
    ok: allNames.filter(n => isScreenOk(n, currentAppearance)).length,
  };
  for (const [key, elId] of [["unreviewed", "pillUnreviewed"], ["updated", "pillUpdated"],
                             ["open", "pillOpen"],
                             ["proposed", "pillProposed"], ["approved", "pillApproved"],
                             ["fixed", "pillFixed"], ["rejected", "pillRejected"],
                             ["discussed", "pillDiscussed"], ["accepted", "pillAccepted"],
                             ["ok", "pillOk"]]) {
    const el = document.getElementById(elId);
    if (!el) continue;
    const label = { unreviewed: "待查看", updated: "有更新", open: "待处理", proposed: "待批准", approved: "已批准",
                    fixed: "待验收", accepted: "已通过", rejected: "已驳回",
                    discussed: "待探讨", ok: "没问题" }[key];
    const shownState = isStatusShown(key);
    el.innerHTML = `<span class="sw-dot"></span><span>${label} ${counts[key]}</span>`;
    el.classList.toggle("on", shownState);
    el.classList.toggle("off", !shownState);
    el.classList.toggle("zero", counts[key] === 0);
    if (key === "discussed") el.style.display = (counts[key] > 0 || !shownState) ? "" : "none";
  }

  document.getElementById("scopeBtn").textContent = showAllScope ? "全部图" : "当前图";
  document.getElementById("scopeBtn").classList.toggle("active", showAllScope);
  document.getElementById("zoomBtn").classList.toggle("active", zoom100);
  document.getElementById("canvasWrap").classList.toggle("zoom100", zoom100);
  document.getElementById("afterWrap").classList.toggle("zoom100", zoom100);
  document.getElementById("curtainWrap").classList.toggle("zoom100", zoom100);

  // 解析当前图的多版本状态
  const sv = currentImage ? resolveStageVersions(currentImage) : { versions: [], focus: null, leftVer: null, rightVer: null, missingRightBuild: "", isManual: false };
  if (stageViewMode === "curtain" && (!sv.leftVer || !sv.rightVer)) {
    stageViewMode = "side";
  }
  renderStageBar(sv);

  const annotateStage = document.getElementById("annotateStage");
  const curtainStage = document.getElementById("curtainStage");
  const beforeCol = document.getElementById("beforeCol");
  const beforeLabel = document.getElementById("beforeLabel");
  const afterColEl = document.getElementById("afterCol");
  const afterLabel = document.getElementById("afterLabel");
  const stageImg = document.getElementById("stageImg");
  const afterImg = document.getElementById("afterImg");
  const afterWrap = document.getElementById("afterWrap");
  const afterMissing = document.getElementById("afterMissing");
  const modeCn = currentAppearance === "light" ? "亮色" : "暗色";

  if (boardMode === "operate") {
    annotateStage.style.display = "none";
    curtainStage.style.display = "none";
  } else if (stageViewMode === "curtain" && sv.leftVer && sv.rightVer) {
    annotateStage.style.display = "none";
    curtainStage.style.display = "flex";
    document.getElementById("curtainBaseImg").src = sv.leftVer.url;
    document.getElementById("curtainTopImg").src = `${sv.rightVer.url}?t=${Date.now()}`;
    document.getElementById("curtainLeftTag").textContent = `左 · ${sv.leftVer.label}`;
    document.getElementById("curtainRightTag").textContent = `右 · ${sv.rightVer.label}`;
    applyCurtainPosition(curtainPct);
  } else {
    curtainStage.style.display = "none";
    annotateStage.style.display = "flex";
    const hasLeft = Boolean(sv.leftVer);
    const hasRightSlot = stageViewMode !== "single" && (Boolean(sv.rightVer) || Boolean(sv.missingRightBuild));

    beforeCol.style.display = hasLeft ? "flex" : "none";
    afterColEl.style.display = hasRightSlot ? "flex" : "none";

    const leftPrefix = sv.isManual ? "基准" : (sv.focus ? "提出问题" : "改前");
    const rightPrefix = sv.isManual ? "对比" : (sv.focus ? "修复问题" : "改后");

    if (hasLeft) {
      beforeLabel.style.display = "flex";
      beforeLabel.innerHTML = `${leftPrefix}<span class="ver">${esc(sv.leftVer.label)}</span>`;
      stageImg.src = sv.leftVer.url;
    } else {
      beforeLabel.style.display = "none";
      stageImg.removeAttribute("src");
    }

    if (hasRightSlot) {
      if (sv.rightVer) {
        afterLabel.innerHTML = `${rightPrefix}<span class="ver">${esc(sv.rightVer.label)}</span>`;
        afterWrap.style.display = "inline-block";
        afterMissing.style.display = "none";
        afterImg.src = `${sv.rightVer.url}?t=${Date.now()}`;
      } else if (sv.missingRightBuild) {
        const va = verLabelForBuild(currentImage, sv.missingRightBuild, "after");
        afterLabel.innerHTML = `${rightPrefix}<span class="ver">${esc(va)}</span>`;
        afterWrap.style.display = "none";
        afterImg.removeAttribute("src");
        afterMissing.style.display = "flex";
        afterMissing.innerHTML = `<strong>${esc(va || ("Build " + sv.missingRightBuild))}</strong>`
          + `<span>暂无${modeCn}修复图</span>`
          + `<span style="font-size:11px;opacity:.75">补拍请运行：<br/>ujshot run --appearance ${esc(currentAppearance)} --board-as-after</span>`;
      }
    } else {
      afterWrap.style.display = "none";
      afterMissing.style.display = "none";
      afterImg.removeAttribute("src");
    }
    document.getElementById("afterWrap").style.pointerEvents = (hasRightSlot && sv.rightVer) ? "auto" : "none";
    document.getElementById("canvasWrap").style.pointerEvents = hasLeft ? "auto" : "none";
  }

  // 左侧截图列表
  const listEl = document.getElementById("imageList");
  listEl.innerHTML = "";
  allNames = allImageNames(currentAppearance);
  let shown = 0;
  for (const img of allNames) {
    if (!imageMatches(img)) continue;
    shown++;
    const anns = state.annotations.filter(a => a.image === img && appearanceOf(a) === currentAppearance);
    const pr = pairState(img, currentAppearance);
    const imgVers = versionsForImage(img, currentAppearance);

    const thumbs = pr.hasBefore && pr.hasAfter
      ? `<div class="thumb-pair">
           <img src="${beforeUrl(img, currentAppearance)}" loading="lazy" alt="改前" />
           <img src="${afterUrl(img, false, currentAppearance)}" loading="lazy" alt="改后" />
         </div>`
      : `<div class="thumb-pair">
           <img class="${pr.hasAfter ? "only" : ""}" src="${pr.hasBefore ? beforeUrl(img, currentAppearance) : afterUrl(img, false, currentAppearance)}" loading="lazy" alt="${pr.hasBefore ? "改前" : "改后"}" />
         </div>`;

    const c = {
      rejected: anns.filter(a => bucketOf(a) === "rejected").length,
      fixed: anns.filter(a => bucketOf(a) === "fixed").length,
      proposed: anns.filter(a => bucketOf(a) === "proposed").length,
      approved: anns.filter(a => bucketOf(a) === "approved").length,
      open: anns.filter(a => bucketOf(a) === "open").length,
      discussed: anns.filter(a => bucketOf(a) === "discussed").length,
    };
    let dot = "accepted", label = `${anns.length}`;
    if (c.rejected) { dot = "rejected"; label = `${c.rejected}`; }
    else if (c.fixed) { dot = "fixed"; label = `${c.fixed}`; }
    else if (c.proposed) { dot = "proposed"; label = `${c.proposed}`; }
    else if (c.open) { dot = "open"; label = `${c.open}`; }
    else if (c.approved) { dot = "approved"; label = `${c.approved}`; }
    else if (c.discussed) { dot = "discussed"; label = `${c.discussed}`; }

    const verPill = imgVers.length >= 2 ? `<span class="ver-count-pill">${imgVers.length}版</span>` : "";
    const ok = isScreenOk(img, currentAppearance);
    const upd = isScreenUpdated(img, currentAppearance);
    const updRow = upd ? screenCheckRow(img, currentAppearance) : null;
    const unrev = isScreenUnreviewed(img, currentAppearance);
    const okPill = ok ? `<span class="ok-pill">✓ 没问题</span>` : "";
    const updPill = upd ? `<span class="updated-pill" title="该界面原本已确认无问题或批注已通过，但在最新构建中画面发生了变化">↻ 有更新${updRow && updRow.diffPct ? ` ${updRow.diffPct}%` : ""}</span>` : "";
    const unrevPill = unrev ? `<span class="unreviewed-pill">待查看</span>` : "";
    const humanAnns = anns.filter(a => !(a.source === "ujshot" && bucketOf(a) === "accepted"));
    const meta = humanAnns.length
      ? `<div class="thumb-line"><span class="dot ${dot}"></span><span>${label}</span>${verPill}${upd ? updPill : okPill}</div>`
      : `<div class="thumb-line">${upd ? updPill : (ok ? okPill : unrevPill)}${verPill}</div>`;

    const div = document.createElement("div");
    div.className = "thumb-item" + (img === currentImage ? " selected" : "") + (ok ? " is-ok" : "") + (upd ? " is-updated" : "");
    div.onclick = () => {
      currentImage = img;
      selectedId = null;
      closePopover();
      if (boardMode === "operate") setBoardMode("annotate", true);
      render();
    };
    div.innerHTML = `
      ${thumbs}
      <div class="thumb-meta">
        <div class="thumb-name" title="${esc(img)}">${esc(img.replace(/\.png$/i, ""))}</div>
        ${meta}
      </div>`;
    listEl.appendChild(div);
  }

  if (shown === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = `当前显示开关下没有截图<br/><button class="mini-link" onclick="clearImageFilters()">全部显示</button>`;
    listEl.appendChild(empty);
  }

  const cntEl = document.getElementById("imageCount");
  if (cntEl) cntEl.textContent = shown === allNames.length ? `${allNames.length}` : `${shown}/${allNames.length}`;

  const vbEl = document.getElementById("verBefore"), vaEl = document.getElementById("verAfter");
  const vbTop = (state.versions || {}).before || "", vaTop = (state.versions || {}).after || "";
  if (vbEl) {
    vbEl.textContent = vbTop || "改前 —";
    vbEl.classList.toggle("is-empty", !vbTop);
    vbEl.title = vbTop ? `改前这批来自 ${vbTop}（点这里改）` : "还没标改前版本（点这里设置）";
  }
  if (vaEl) {
    vaEl.textContent = vaTop || "改后 —";
    vaEl.classList.toggle("is-empty", !vaTop);
    vaEl.title = vaTop ? `改后这批来自 ${vaTop}（点这里改）` : "还没标改后版本（点这里设置）";
  }

  const hintEl = document.getElementById("stageHint");
  if (hintEl) {
    if (!currentImage) hintEl.textContent = `当前${modeCn}槽位暂无截图`;
    else if (stageViewMode === "curtain") hintEl.textContent = "拖动中线对比像素差异 · 切回「并排」或「单图」可画框批注";
    else if (sv.versions.length === 1) hintEl.textContent = "单机落图钉 · 拖拽画框 · 方向键 ←/→ 切图";
    else hintEl.textContent = "单击落图钉 · 拖拽画框 · 1 并排 / 2 卷帘 / 3 单图";
  }

  renderOverlay(sv);
  renderDispatchBar();
  renderLogDrawer();
  renderCards(sv);
}

function renderOverlay(sv) {
  const ovBefore = document.getElementById("overlay");
  const ovAfter = document.getElementById("afterOverlay");
  const hiddenBtn = document.getElementById("hiddenAnnsBtn");
  ovBefore.innerHTML = "";
  if (ovAfter) ovAfter.innerHTML = "";
  lastHiddenAnnId = null;
  if (hiddenBtn) hiddenBtn.style.display = "none";
  if (!currentImage || stageViewMode === "curtain") return;

  const leftB = sv.leftVer ? sv.leftVer.build : "";
  const rightB = (stageViewMode !== "single" && sv.rightVer) ? sv.rightVer.build : "";
  const showAfterCol = stageViewMode !== "single" && Boolean(sv.rightVer);

  const anns = state.annotations.filter(
    a => a.image === currentImage && appearanceOf(a) === currentAppearance && matchesFilter(a)
  );
  const hiddenAnns = [];

  for (const a of anns) {
    // ujshot 自动整屏 OCR 结论只展示在右侧列表，不在截图灵动岛上落固定图钉挡画面
    if (a.source === "ujshot" && a.kind === "pin") continue;
    const rb = raisedInOf(a);
    let ov = null;
    if (rb) {
      if (sv.leftVer && String(rb) === String(leftB)) ov = ovBefore;
      else if (showAfterCol && ovAfter && String(rb) === String(rightB)) ov = ovAfter;
      else {
        hiddenAnns.push(a);
        continue;
      }
    } else {
      ov = (a.target === "after" && ovAfter && showAfterCol) ? ovAfter : (sv.leftVer ? ovBefore : null);
    }
    if (!ov) continue;

    const cls = `${a.author} ${bucketOf(a)}` + (a.id === selectedId ? " active" : "");
    if (a.kind === "box" && a.w > 0.01 && a.h > 0.01) {
      const box = document.createElement("div");
      box.className = "box-mark " + cls;
      box.style.left = (a.x * 100) + "%";
      box.style.top = (a.y * 100) + "%";
      box.style.width = (a.w * 100) + "%";
      box.style.height = (a.h * 100) + "%";
      box.innerHTML = `<span class="box-tag">${esc(a.id)}</span>`;
      box.onclick = (e) => { e.stopPropagation(); selectAnn(a.id); };
      ov.appendChild(box);
    } else {
      const pin = document.createElement("div");
      pin.className = "pin " + cls;
      pin.style.left = (a.x * 100) + "%";
      pin.style.top = (a.y * 100) + "%";
      pin.textContent = a.id;
      pin.onclick = (e) => { e.stopPropagation(); selectAnn(a.id); };
      ov.appendChild(pin);
    }
  }

  if (hiddenAnns.length > 0 && hiddenBtn) {
    lastHiddenAnnId = hiddenAnns[0].id;
    hiddenBtn.textContent = `另有 ${hiddenAnns.length} 条批注在其他版本 · 点击定位`;
    hiddenBtn.style.display = "inline-block";
  }
}

function renderCards(sv) {
  const container = document.getElementById("annList");
  container.innerHTML = "";

  if (!showAllScope && currentImage && isScreenUpdated(currentImage, currentAppearance)) {
    const urow = screenCheckRow(currentImage, currentAppearance) || {};
    const banner = document.createElement("div");
    banner.className = "screen-updated-banner";
    const prevTxt = urow.prevBuild ? `Build ${urow.prevBuild}` : "上一版";
    const curTxt = urow.build ? `Build ${urow.build}` : "最新版";
    const diffTxt = urow.diffPct ? `（像素差异 ${urow.diffPct}%）` : "";
    banner.innerHTML = `
      <div>
        <div><strong>↻ 此界面有更新</strong>${esc(diffTxt)}</div>
        <div class="sub">${esc(prevTxt)} → ${esc(curTxt)} 画面发生变动，请核对左右对比图。</div>
      </div>
      <button class="btn-accept" style="flex-shrink:0;" onclick="toggleCurrentScreenOk()">✓ 确认无问题</button>
    `;
    container.appendChild(banner);
  }

  const scoped = showAllScope
    ? state.annotations.filter(a => appearanceOf(a) === currentAppearance)
    : state.annotations.filter(a => a.image === currentImage && appearanceOf(a) === currentAppearance);

  const items = scoped.filter(matchesFilter);

  if (items.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.innerHTML = scoped.length === 0
      ? `当前暂无批注。<br/>直接在中间截图上<b>单击落图钉</b>或<b>拖框圈选</b>即可添加。`
      : `没有匹配的批注<br/><button class="mini-link" onclick="clearImageFilters()">清除筛选</button>`;
    container.appendChild(empty);
    return;
  }

  const activeRightB = (sv && sv.rightVer) ? sv.rightVer.build : "";

  for (const a of items) {
    const rb = raisedInOf(a);
    const fb = fixedInOf(a);
    const rounds = roundsOf(a);
    const round = activeRound(a);
    const curStatus = (round && round.status) || a.status || "open";
    const curReason = (round && round.rejectReason !== undefined) ? round.rejectReason : a.rejectReason;
    const settled = curStatus === "accepted" || curStatus === "ignored";
    const job = activeJobForAnn(a.id);
    const prevResumable = !job ? resumableJobForAnn(a.id) : null;

    const card = document.createElement("div");
    card.className = "card" + (a.id === selectedId ? " active" : "") + (settled ? " settled" : "");
    card.id = "card-" + a.id;
    card.onclick = () => { focusAnnotation(liveAnn(a) || a, false); };

    const verText = (rb && fb) ? `${rb} → ${fb}`
      : (fb ? `修于 ${fb}` : (rb ? `B${rb}` : ""));
    const imgPrefix = showAllScope ? (a.image.replace(/\.png$/i, "") + " · ") : "";

    const candidateRounds = rounds.length >= 2 ? rounds.map(r => String(r.build)) : [];
    const roundBar = candidateRounds.length >= 2
      ? `<div class="round-bar">` + candidateRounds.map(b => {
          const row = rounds.find(r => String(r.build) === String(b));
          const st = row && row.status;
          const cls = "round-chip" + (String(b) === String(activeRightB) ? " active" : "")
            + (st ? " on-" + esc(st) : "");
          const labelSt = st ? (ROUND_LABELS[st] || st) : "";
          return `<button class="${cls}" data-build="${esc(b)}" title="${esc(labelSt || "点此查看这一版修复图")}">`
            + `Build ${esc(b || "本地")}${labelSt ? ` · ${esc(labelSt)}` : ""}</button>`;
        }).join("") + `</div>`
      : "";

    card.innerHTML = `
      <div class="card-head">
        <div class="card-id">
          <span title="${esc(a.id)}">${esc(a.id)}</span>
          <span class="st-badge st-${esc(curStatus)}">${esc(STATUS_TEXT[curStatus] || curStatus)}</span>
          ${a.author === "ai" ? `<span class="badge ai">AI</span>` : ""}
        </div>
        <div class="card-right">
          ${(imgPrefix || verText) ? `<span class="ver-meta" title="${esc(imgPrefix + verText)}">${esc(imgPrefix + verText)}</span>` : ""}
          <div class="more-wrap">
            <button class="more-btn" title="更多操作">⋯</button>
            <div class="more-menu" style="display:none;"></div>
          </div>
        </div>
      </div>${roundBar}`;

    // ⋯ 更多菜单：收拢编辑、低频状态切换、重修与删除
    const moreBtn = card.querySelector(".more-btn");
    const moreMenu = card.querySelector(".more-menu");
    moreBtn.onclick = (e) => {
      e.stopPropagation();
      const wasOpen = moreMenu.style.display === "flex";
      document.querySelectorAll(".more-menu").forEach(m => { m.style.display = "none"; });
      moreMenu.style.display = wasOpen ? "none" : "flex";
    };
    const addMenuItem = (label, fn, cls) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (cls) btn.className = cls;
      btn.onclick = (e) => { e.stopPropagation(); moreMenu.style.display = "none"; fn(); };
      moreMenu.appendChild(btn);
    };
    addMenuItem("编辑批注", () => { editingNoteIds.add(a.id); renderCards(sv); });
    if (curStatus !== "approved") {
      addMenuItem("批准方案（已批准）", () => { openRejectEditors.delete(a.id); rejectDrafts.delete(a.id); markRound(a, "approved", ""); persist(); render(); });
    }
    if (curStatus !== "proposed") {
      addMenuItem("设为待批准方案", () => { openRejectEditors.delete(a.id); rejectDrafts.delete(a.id); markRound(a, "proposed", ""); persist(); render(); });
    }
    if (curStatus !== "open") {
      addMenuItem("重新打开（待处理）", () => { openRejectEditors.delete(a.id); rejectDrafts.delete(a.id); markRound(a, "open", ""); persist(); render(); });
    }
    if (curStatus !== "discussed") {
      addMenuItem("标记待探讨", () => { openRejectEditors.delete(a.id); rejectDrafts.delete(a.id); markRound(a, "discussed"); persist(); render(); });
    }
    if (curStatus !== "ignored") {
      addMenuItem("忽略此条", () => { openRejectEditors.delete(a.id); rejectDrafts.delete(a.id); markRound(a, "ignored"); persist(); render(); });
    }
    const agMenu = selectedAgentObj();
    if (settled && agMenu && agMenu.available && !job) {
      addMenuItem(`派给 ${agMenu.label} 重修`, () => { dispatchAnnotations([a.id]); });
    }
    if (prevResumable && !job) {
      addMenuItem(`续接上次会话 (#${prevResumable.sessionId.slice(0, 6)})`, () => { resumeJob(prevResumable.id); });
    }
    moreMenu.appendChild(document.createElement("hr"));
    addMenuItem("删除批注", () => {
      state.annotations = state.annotations.filter(x => x.id !== a.id);
      openRejectEditors.delete(a.id);
      rejectDrafts.delete(a.id);
      if (selectedId === a.id) selectedId = null;
      persist();
      render();
    }, "danger");

    // 轮次胶囊
    card.querySelectorAll(".round-chip").forEach(chip => {
      chip.onclick = (e) => {
        e.stopPropagation();
        delete manualCompare[manualKey(a.image, currentAppearance)];
        selectedRound[a.image] = chip.dataset.build;
        selectedId = a.id;
        render();
      };
    });

    if (a.elementHint) {
      const hintEl = document.createElement("div");
      hintEl.className = "el-hint-line";
      hintEl.textContent = a.elementHint;
      hintEl.title = a.elementHint;
      card.appendChild(hintEl);
    }

    // 正文：直接呈现，双击或从 ⋯ 编辑
    if (editingNoteIds.has(a.id) || !(a.text || "").trim()) {
      const wrap = document.createElement("div");
      wrap.className = "edit-field-wrap";
      wrap.onclick = e => e.stopPropagation();
      const txt = document.createElement("textarea");
      txt.value = a.text || "";
      txt.placeholder = "输入问题描述...";
      txt.oninput = () => autoSizeTextarea(txt);
      const act = document.createElement("div");
      act.className = "edit-field-actions";
      const saveB = document.createElement("button");
      saveB.className = "primary";
      saveB.textContent = "保存";
      saveB.onclick = () => {
        const live = liveAnn(a);
        if (live) live.text = txt.value.trim();
        editingNoteIds.delete(a.id);
        persist();
        renderCards(sv);
      };
      const cancelB = document.createElement("button");
      cancelB.textContent = "取消";
      cancelB.onclick = () => { editingNoteIds.delete(a.id); renderCards(sv); };
      act.appendChild(cancelB);
      act.appendChild(saveB);
      wrap.appendChild(txt);
      wrap.appendChild(act);
      card.appendChild(wrap);
      setTimeout(() => autoSizeTextarea(txt), 0);
    } else {
      const body = document.createElement("div");
      body.className = "note-text";
      body.textContent = a.text;
      body.title = "双击可编辑";
      body.ondblclick = (e) => { e.stopPropagation(); editingNoteIds.add(a.id); renderCards(sv); };
      card.appendChild(body);
    }

    const aiReplyText = (round && round.aiReply) || a.aiReply || (a.author !== "ai" ? a.reply : "") || "";
    if (aiReplyText) {
      const box = document.createElement("div");
      box.className = "ai-reply-box";
      const replyTitle = curStatus === "proposed" ? "AI 准备方案（待你批准）"
        : (curStatus === "approved" ? "AI 准备方案（已批准）" : "AI 回复");
      box.innerHTML = `<div class="ai-reply-title">${esc(replyTitle)}</div>`;
      const body = document.createElement("div");
      body.textContent = aiReplyText;
      box.appendChild(body);
      card.appendChild(box);
    }

    if (curStatus === "rejected" || openRejectEditors.has(a.id)) {
      const rbox = document.createElement("div");
      rbox.className = "reject-box";
      rbox.onclick = e => e.stopPropagation();
      const isPendingReject = curStatus !== "rejected";
      const isEditingRej = openRejectEditors.has(a.id) || !(curReason || "").trim();
      const rhead = document.createElement("div");
      rhead.className = "reject-box-title";
      rhead.innerHTML = `<span>驳回原因${isEditingRej ? (isPendingReject ? "（填写后确认驳回）" : "（编辑中）") : ""}</span>`;
      if (!isEditingRej) {
        const eb = document.createElement("button");
        eb.className = "mini-link";
        eb.style.color = "#fca5a5";
        eb.textContent = "修改";
        eb.onclick = () => {
          openRejectEditors.add(a.id);
          renderCards(sv);
          setTimeout(() => {
            const el = document.getElementById("rej-txt-" + a.id);
            if (el) { autoSizeTextarea(el); el.focus(); }
          }, 30);
        };
        rhead.appendChild(eb);
      }
      rbox.appendChild(rhead);

      if (isEditingRej) {
        const rtxt = document.createElement("textarea");
        rtxt.id = "rej-txt-" + a.id;
        rtxt.value = rejectDrafts.has(a.id) ? rejectDrafts.get(a.id) : (curReason || "");
        rtxt.placeholder = "写清楚哪里还不满意、希望怎么改...";
        const ract = document.createElement("div");
        ract.className = "edit-field-actions";
        const canCancel = isPendingReject || !!(curReason || "").trim();
        let rcancel = null;
        if (canCancel) {
          rcancel = document.createElement("button");
          rcancel.textContent = "取消";
          rcancel.onclick = () => {
            openRejectEditors.delete(a.id);
            rejectDrafts.delete(a.id);
            renderCards(sv);
          };
          ract.appendChild(rcancel);
        }
        const rsave = document.createElement("button");
        rsave.className = "primary";
        rsave.textContent = isPendingReject ? "确认驳回" : "保存驳回原因";
        rsave.disabled = !rtxt.value.trim();
        rtxt.oninput = () => {
          rejectDrafts.set(a.id, rtxt.value);
          autoSizeTextarea(rtxt);
          rsave.disabled = !rtxt.value.trim();
        };
        rtxt.onkeydown = (e) => {
          if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && !rsave.disabled) {
            e.preventDefault();
            rsave.click();
          } else if (e.key === "Escape" && rcancel) {
            e.preventDefault();
            rcancel.click();
          }
        };
        rsave.onclick = () => {
          const reason = rtxt.value.trim();
          if (!reason) { rtxt.focus(); return; }
          markRound(a, "rejected", reason);
          openRejectEditors.delete(a.id);
          rejectDrafts.delete(a.id);
          persist();
          render();
        };
        ract.appendChild(rsave);
        rbox.appendChild(rtxt);
        rbox.appendChild(ract);
        setTimeout(() => autoSizeTextarea(rtxt), 0);
      } else {
        const rbody = document.createElement("div");
        rbody.className = "reject-box-body";
        rbody.textContent = curReason;
        rbox.appendChild(rbody);
      }
      card.appendChild(rbox);
    }

    if (a.author === "ai" && a.reply) {
      const urep = document.createElement("div");
      urep.className = "note-display";
      urep.innerHTML = `<div class="note-display-head"><span>你的补充意见</span></div>`;
      const ub = document.createElement("div");
      ub.textContent = a.reply;
      urep.appendChild(ub);
      card.appendChild(urep);
    }

    // 底部上下文操作区：按当前状态只展示真正需要的 1~2 个按钮
    const actions = document.createElement("div");
    actions.className = "card-actions";
    if (job) {
      const pill = document.createElement("button");
      pill.className = "job-pill " + job.status;
      pill.textContent = job.status === "queued" ? `⏳ ${job.agentLabel} 排队中` : `⚡ ${job.agentLabel} 执行中…`;
      pill.onclick = (e) => { e.stopPropagation(); openJobLog(job.id); };
      actions.appendChild(pill);
      const stopBtn = document.createElement("button");
      stopBtn.className = "btn-stop";
      stopBtn.textContent = "停止";
      stopBtn.onclick = (e) => { e.stopPropagation(); cancelJob(job.id); };
      actions.appendChild(stopBtn);
    } else if (curStatus === "fixed") {
      if (!openRejectEditors.has(a.id)) {
        const accBtn = document.createElement("button");
        accBtn.className = "btn-accept";
        accBtn.textContent = "✓ 通过";
        accBtn.onclick = (e) => {
          e.stopPropagation();
          markRound(a, "accepted", "");
          openRejectEditors.delete(a.id);
          rejectDrafts.delete(a.id);
          persist();
          render();
        };
        const rejBtn = document.createElement("button");
        rejBtn.className = "btn-reject";
        rejBtn.textContent = "↩ 驳回";
        rejBtn.onclick = (e) => {
          e.stopPropagation();
          openRejectEditors.add(a.id);
          renderCards(sv);
          setTimeout(() => {
            const el = document.getElementById("rej-txt-" + a.id);
            if (el) { autoSizeTextarea(el); el.focus(); }
          }, 30);
        };
        actions.appendChild(accBtn);
        actions.appendChild(rejBtn);
      }
    } else if (curStatus === "proposed") {
      if (!openRejectEditors.has(a.id)) {
        const appBtn = document.createElement("button");
        appBtn.className = "btn-approve";
        appBtn.textContent = "✓ 批准方案";
        appBtn.onclick = (e) => {
          e.stopPropagation();
          markRound(a, "approved", "");
          openRejectEditors.delete(a.id);
          rejectDrafts.delete(a.id);
          persist();
          showToast(`已批准 ${a.id} 方案`);
          render();
        };
        const rejBtn = document.createElement("button");
        rejBtn.className = "btn-reject";
        rejBtn.textContent = "↩ 驳回方案";
        rejBtn.onclick = (e) => {
          e.stopPropagation();
          openRejectEditors.add(a.id);
          renderCards(sv);
          setTimeout(() => {
            const el = document.getElementById("rej-txt-" + a.id);
            if (el) { autoSizeTextarea(el); el.focus(); }
          }, 30);
        };
        actions.appendChild(appBtn);
        actions.appendChild(rejBtn);
      }
    } else if (curStatus === "open" || curStatus === "approved" || curStatus === "rejected") {
      if (curStatus === "open" && !openRejectEditors.has(a.id)) {
        const appBtn = document.createElement("button");
        appBtn.className = "btn-approve";
        appBtn.textContent = aiReplyText ? "✓ 批准方案" : "✓ 批准";
        appBtn.onclick = (e) => {
          e.stopPropagation();
          markRound(a, "approved", "");
          openRejectEditors.delete(a.id);
          rejectDrafts.delete(a.id);
          persist();
          showToast(`已批准 ${a.id}`);
          render();
        };
        actions.appendChild(appBtn);
      }
      const ag = selectedAgentObj();
      if (ag && ag.available) {
        const runBtn = document.createElement("button");
        runBtn.className = "btn-dispatch";
        runBtn.textContent = curStatus === "rejected" ? `🚀 派给 ${ag.label} 重修`
          : (curStatus === "approved" ? `🚀 已批准·派给 ${ag.label}` : `🚀 派给 ${ag.label}`);
        runBtn.onclick = (e) => { e.stopPropagation(); dispatchAnnotations([a.id]); };
        actions.appendChild(runBtn);
      }
      if (prevResumable) {
        const resBtn = document.createElement("button");
        resBtn.className = "btn-resume";
        resBtn.textContent = `↻ 续接 #${prevResumable.sessionId.slice(0, 6)}`;
        resBtn.title = `续接上次 ${prevResumable.agentLabel} 会话上下文`;
        resBtn.onclick = (e) => { e.stopPropagation(); resumeJob(prevResumable.id); };
        actions.appendChild(resBtn);
      }
    }
    if (actions.childElementCount > 0) {
      card.appendChild(actions);
    }
    container.appendChild(card);
  }
}

function focusAnnotation(a, scrollCard) {
  if (!a) return;
  const app = appearanceOf(a);
  if (app !== currentAppearance) currentAppearance = app;
  if (a.image && a.image !== currentImage) currentImage = a.image;
  delete manualCompare[manualKey(currentImage, currentAppearance)];
  delete selectedRound[currentImage];
  selectedId = a.id;
  // 选中批注时若处于单图模式且该批注有两版可对比，自动切回并排双图展示
  if (stageViewMode === "single") {
    const sv = resolveStageVersions(currentImage, currentAppearance);
    if (sv.leftVer && (sv.rightVer || sv.missingRightBuild)) {
      stageViewMode = "side";
    }
  }
  render();
  if (scrollCard) {
    const el = document.getElementById("card-" + a.id);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

function selectAnn(id) {
  const found = state.annotations.find(x => x.id === id);
  if (found) {
    focusAnnotation(found, true);
  } else {
    selectedId = id;
    render();
  }
}

function bindCanvasAnnotation(wrapEl, overlayId, targetName) {
  if (!wrapEl) return;
  wrapEl.addEventListener("mousedown", (e) => {
    if (e.button !== 0 || e.target.closest(".pin, .box-mark")) return;
    const rect = wrapEl.getBoundingClientRect();
    dragStart = {
      clientX: e.clientX, clientY: e.clientY,
      x: (e.clientX - rect.left) / rect.width,
      y: (e.clientY - rect.top) / rect.height,
      rect, overlayId, target: targetName
    };
  });
}
bindCanvasAnnotation(document.getElementById("canvasWrap"), "overlay", "before");
bindCanvasAnnotation(document.getElementById("afterWrap"), "afterOverlay", "after");

window.addEventListener("mousemove", (e) => {
  if (!dragStart) return;
  const dx = Math.abs(e.clientX - dragStart.clientX);
  const dy = Math.abs(e.clientY - dragStart.clientY);
  if (dx > 10 || dy > 10) {
    if (!draftEl) {
      draftEl = document.createElement("div");
      draftEl.className = "draft-box";
      document.getElementById(dragStart.overlayId).appendChild(draftEl);
    }
    const r = dragStart.rect;
    const x2 = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
    const y2 = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));
    const x = Math.min(dragStart.x, x2), y = Math.min(dragStart.y, y2);
    const w = Math.abs(x2 - dragStart.x), h = Math.abs(y2 - dragStart.y);
    draftEl.style.left = (x * 100) + "%";
    draftEl.style.top = (y * 100) + "%";
    draftEl.style.width = (w * 100) + "%";
    draftEl.style.height = (h * 100) + "%";
  }
});

window.addEventListener("mouseup", (e) => {
  if (!dragStart) return;
  const r = dragStart.rect;
  const dx = Math.abs(e.clientX - dragStart.clientX);
  const dy = Math.abs(e.clientY - dragStart.clientY);
  const x2 = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width));
  const y2 = Math.max(0, Math.min(1, (e.clientY - r.top) / r.height));

  if (dx > 12 || dy > 12) {
    pendingDraft = {
      kind: "box",
      target: dragStart.target,
      x: Number(Math.min(dragStart.x, x2).toFixed(4)),
      y: Number(Math.min(dragStart.y, y2).toFixed(4)),
      w: Number(Math.abs(x2 - dragStart.x).toFixed(4)),
      h: Number(Math.abs(y2 - dragStart.y).toFixed(4)),
    };
  } else {
    pendingDraft = {
      kind: "pin",
      target: dragStart.target,
      x: Number(Math.max(0, Math.min(1, dragStart.x)).toFixed(4)),
      y: Number(Math.max(0, Math.min(1, dragStart.y)).toFixed(4)),
      w: 0, h: 0
    };
  }
  dragStart = null;
  openPopover(e.clientX, e.clientY);
});

async function inspectPointOrBox(payload) {
  try {
    const res = await fetch(api("/api/inspect"), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    if (!res.ok) return null;
    const data = await res.json();
    return (data && data.ok && data.summary) ? data : null;
  } catch (e) {
    return null;
  }
}

function openPopover(cx, cy) {
  const pop = document.getElementById("popover");
  const hintEl = document.getElementById("popHint");
  const id = nextUserId();
  const sv = resolveStageVersions(currentImage);
  const verObj = pendingDraft.target === "after" ? sv.rightVer : sv.leftVer;
  const side = verObj ? `${verObj.shortLabel} · ` : "";
  document.getElementById("popTitle").textContent =
    `${id} · ${side}${pendingDraft.kind === "box" ? "框选批注" : "图钉批注"} (${Math.round(pendingDraft.x*100)}%, ${Math.round(pendingDraft.y*100)}%)`;
  if (hintEl) {
    hintEl.style.display = "none";
    hintEl.textContent = "";
    hintEl.title = "";
  }
  pop.style.left = Math.min(window.innerWidth - 320, Math.max(12, cx + 12)) + "px";
  pop.style.top = Math.min(window.innerHeight - 165, Math.max(60, cy + 12)) + "px";
  pop.style.display = "block";
  const ta = document.getElementById("popText");
  ta.value = "";
  setTimeout(() => ta.focus(), 10);

  const draftRef = pendingDraft;
  const build = (verObj && verObj.build) || "";
  inspectPointOrBox({
    image: currentImage,
    appearance: currentAppearance,
    build,
    kind: draftRef.kind,
    x: draftRef.x,
    y: draftRef.y,
    w: draftRef.w,
    h: draftRef.h,
  }).then((res) => {
    if (!res || !res.summary) return;
    draftRef.elementHint = res.summary;
    if (pendingDraft === draftRef && pop.style.display !== "none" && hintEl) {
      hintEl.textContent = res.summary;
      hintEl.title = res.summary;
      hintEl.style.display = "block";
    } else if (draftRef._savedAnnId) {
      const saved = state.annotations.find(x => x.id === draftRef._savedAnnId);
      if (saved && !saved.elementHint) {
        saved.elementHint = res.summary;
        persist();
        renderCards();
      }
    }
  });
}

function closePopover() {
  document.getElementById("popover").style.display = "none";
  const hintEl = document.getElementById("popHint");
  if (hintEl) { hintEl.style.display = "none"; hintEl.textContent = ""; }
  pendingDraft = null;
  if (draftEl) { draftEl.remove(); draftEl = null; }
}

function savePopover() {
  const text = document.getElementById("popText").value.trim();
  if (!text || !pendingDraft) { closePopover(); return; }
  const id = nextUserId();
  const sv = resolveStageVersions(currentImage);
  const clickedVer = (pendingDraft.target === "after") ? sv.rightVer : sv.leftVer;
  const clickedBuild = (clickedVer && clickedVer.build)
    || ((pendingDraft.target === "after") ? buildNoOf(verOf(currentImage, "after")) : buildNoOf(verOf(currentImage, "before")));
  const entry = {
    id,
    image: currentImage,
    target: "before",
    appearance: currentAppearance,
    raisedIn: clickedBuild || undefined,
    author: "user",
    kind: pendingDraft.kind,
    x: pendingDraft.x,
    y: pendingDraft.y,
    w: pendingDraft.w,
    h: pendingDraft.h,
    text,
    reply: "",
    status: "open",
    createdAt: new Date().toISOString()
  };
  if (pendingDraft.elementHint) entry.elementHint = pendingDraft.elementHint;
  pendingDraft._savedAnnId = id;
  state.annotations.push(entry);
  selectedId = id;
  clearScreenOkIfSet(currentImage, currentAppearance);
  closePopover();
  persist();
  render();
}

document.getElementById("popText").addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter") { e.preventDefault(); savePopover(); }
  if (e.key === "Escape") closePopover();
});

window.addEventListener("keydown", (e) => {
  if (["TEXTAREA", "INPUT", "SELECT"].includes(document.activeElement.tagName)) return;
  if (e.key === "Escape") closePopover();
  if (e.key === "1") { setStageViewMode("side"); return; }
  if (e.key === "2") { setStageViewMode("curtain"); return; }
  if (e.key === "3") { setStageViewMode("single"); return; }
  const navNames = allImageNames(currentAppearance).filter(n => imageMatches(n));
  const idx = navNames.indexOf(currentImage);
  if (e.key === "ArrowRight" && idx >= 0 && idx < navNames.length - 1) {
    currentImage = navNames[idx + 1]; selectedId = null; closePopover(); render();
  }
  if (e.key === "ArrowLeft" && idx > 0) {
    currentImage = navNames[idx - 1]; selectedId = null; closePopover(); render();
  }
});

function toggleScope() { showAllScope = !showAllScope; render(); }
function toggleZoom() { zoom100 = !zoom100; render(); }

async function copyForAI() {
  const active = state.annotations.filter(
    a => a.status === "open" || a.status === "proposed" || a.status === "approved" || a.status === "rejected"
  );
  const lines = [
    `请按以下标注修改界面（完整 JSON：\`${state.dir}/annotations.json\`）：`,
    ""
  ];
  for (const a of active) {
    const pos = a.kind === "box"
      ? `框选(${Math.round(a.x*100)}%,${Math.round(a.y*100)}% ${Math.round(a.w*100)}×${Math.round(a.h*100)}%)`
      : `坐标(${Math.round(a.x*100)}%,${Math.round(a.y*100)}%)`;
    const tag = a.status === "approved" ? "[已批准]"
      : (a.status === "proposed" ? "[待批准]"
      : (a.status === "rejected" ? "[已驳回]" : "[待处理]"));
    const appTag = appearanceOf(a) === "light" ? "[亮色]" : "[暗色]";
    const locHint = a.elementHint ? ` ｜定位：${a.elementHint}` : "";
    const plan = a.aiReply ? ` ｜方案：${a.aiReply}` : "";
    const extra = a.reply ? ` ｜补充：${a.reply}` : "";
    const rej = (a.status === "rejected" && a.rejectReason) ? ` ｜驳回原因：${a.rejectReason}` : "";
    lines.push(`- **${a.id}** ${tag}${appTag} \`${a.image}\` ${pos}${locHint}：${a.text}${plan}${extra}${rej}`);
  }
  if (active.length === 0) lines.push("（当前无待处理、已确认或已驳回标注）");
  await navigator.clipboard.writeText(lines.join("\n"));
  showToast("已复制 Markdown 批注到剪贴板，直接发给 AI 即可");
}

// ---- 实时模拟器操作模式
let boardMode = "annotate";
let simInfo = { available: false };
let liveTimer = null;
let liveFetching = false;
let liveDragStart = null;

async function initSim() {
  try {
    const res = await fetch(api("/api/sim/status"));
    simInfo = await res.json();
    if (simInfo.available) {
      document.getElementById("modeSwitch").style.display = "inline-flex";
    }
  } catch (e) {}
}

function setBoardMode(mode, skipAutoFreeze = false) {
  if (mode === "operate" && !simInfo.available) {
    showToast("未检测到运行中的 iOS 模拟器");
    return;
  }
  if (mode === "annotate" && boardMode === "operate" && !skipAutoFreeze) {
    freezeAndAnnotate();
    return;
  }
  boardMode = mode;
  const isOp = mode === "operate";
  document.getElementById("modeOperateBtn").classList.toggle("active", isOp);
  document.getElementById("modeAnnotateBtn").classList.toggle("active", !isOp);
  document.getElementById("liveStage").style.display = isOp ? "flex" : "none";
  if (isOp) {
    document.getElementById("stageBar").style.display = "none";
    document.getElementById("annotateStage").style.display = "none";
    document.getElementById("curtainStage").style.display = "none";
    closePopover();
    startLivePolling();
  } else {
    stopLivePolling();
    render();
  }
}

async function fetchLiveFrame() {
  if (liveFetching || boardMode !== "operate") return;
  liveFetching = true;
  try {
    const res = await fetch(api("/api/sim/frame?t=" + Date.now()));
    if (res.ok) {
      const blob = await res.blob();
      const img = document.getElementById("liveImg");
      const prev = img.dataset.blobUrl;
      const url = URL.createObjectURL(blob);
      img.src = url;
      img.dataset.blobUrl = url;
      if (prev) URL.revokeObjectURL(prev);
    }
  } catch (e) {}
  liveFetching = false;
}

function startLivePolling() {
  stopLivePolling();
  fetchLiveFrame();
  liveTimer = setInterval(fetchLiveFrame, 450);
}

function stopLivePolling() {
  if (liveTimer) { clearInterval(liveTimer); liveTimer = null; }
}

function showTapRipple(wrap, xNorm, yNorm, isLongPress = false) {
  const r = document.createElement("div");
  r.className = "tap-ripple" + (isLongPress ? " longpress" : "");
  r.style.left = (xNorm * 100) + "%";
  r.style.top = (yNorm * 100) + "%";
  wrap.appendChild(r);
  setTimeout(() => r.remove(), 450);
}

(function bindLiveTouch() {
  const wrap = document.getElementById("liveWrap");
  let liveHoldTimer = null;
  let liveLongPressed = false;
  const clearHold = () => {
    if (liveHoldTimer) { clearTimeout(liveHoldTimer); liveHoldTimer = null; }
  };
  wrap.addEventListener("pointerdown", (e) => {
    if (boardMode !== "operate") return;
    clearHold();
    liveLongPressed = false;
    const rect = wrap.getBoundingClientRect();
    const x = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const y = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    if (e.altKey) {
      liveLongPressed = true;
      liveDragStart = null;
      showTapRipple(wrap, x, y, true);
      freezeAndAnnotate({ pin: { x, y } });
      return;
    }
    liveDragStart = { px: e.clientX, py: e.clientY, x, y };
    liveHoldTimer = setTimeout(() => {
      liveHoldTimer = null;
      if (!liveDragStart || boardMode !== "operate") return;
      const start = liveDragStart;
      liveLongPressed = true;
      liveDragStart = null;
      showTapRipple(wrap, start.x, start.y, true);
      freezeAndAnnotate({ pin: { x: start.x, y: start.y } });
    }, 480);
  });
  wrap.addEventListener("pointermove", (e) => {
    if (!liveDragStart || !liveHoldTimer) return;
    if (Math.hypot(e.clientX - liveDragStart.px, e.clientY - liveDragStart.py) > 10) {
      clearHold();
    }
  });
  wrap.addEventListener("pointercancel", () => {
    clearHold();
    liveDragStart = null;
    liveLongPressed = false;
  });
  wrap.addEventListener("pointerup", async (e) => {
    clearHold();
    if (liveLongPressed) {
      liveLongPressed = false;
      liveDragStart = null;
      return;
    }
    if (!liveDragStart || boardMode !== "operate") return;
    const start = liveDragStart;
    liveDragStart = null;
    const rect = wrap.getBoundingClientRect();
    const x2 = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const y2 = Math.min(1, Math.max(0, (e.clientY - rect.top) / rect.height));
    const dist = Math.hypot(e.clientX - start.px, e.clientY - start.py);
    if (dist > 14) {
      showToast("滑动中…");
      await fetch(api("/api/sim/swipe"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ x1Norm: start.x, y1Norm: start.y, x2Norm: x2, y2Norm: y2 })
      });
    } else {
      showTapRipple(wrap, x2, y2);
      await fetch(api("/api/sim/tap"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ xNorm: x2, yNorm: y2 })
      });
    }
    setTimeout(fetchLiveFrame, 180);
  });
})();

async function sendSimText() {
  const inp = document.getElementById("simTypeInput");
  const text = inp.value;
  if (!text) return;
  await fetch(api("/api/sim/type"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ text })
  });
  inp.value = "";
  showToast("已发送到模拟器");
  setTimeout(fetchLiveFrame, 200);
}

async function sendSimHome() {
  await fetch(api("/api/sim/home"), { method: "POST" });
  setTimeout(fetchLiveFrame, 250);
}

async function launchSimApp() {
  await fetch(api("/api/sim/launch"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ appearance: currentAppearance })
  });
  showToast("正在打开 App…");
  setTimeout(fetchLiveFrame, 600);
}

async function freezeAndAnnotate(opts) {
  showToast("正在定格高清画面…");
  const res = await fetch(api("/api/sim/freeze"), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ appearance: currentAppearance })
  });
  const data = await res.json();
  if (!data.ok) { showToast("定格失败：" + (data.error || "")); return; }
  if (data.images) state.images = data.images;
  if (data.lightImages) state.lightImages = data.lightImages;
  currentImage = data.image;
  selectedId = null;
  setBoardMode("annotate", true);
  render();
  if (opts && opts.pin) {
    const px = Number(Math.max(0, Math.min(1, opts.pin.x)).toFixed(4));
    const py = Number(Math.max(0, Math.min(1, opts.pin.y)).toFixed(4));
    const openPinDraft = () => {
      if (boardMode !== "annotate" || currentImage !== data.image) return;
      closePopover();
      pendingDraft = { kind: "pin", target: "before", x: px, y: py, w: 0, h: 0 };
      const ov = document.getElementById("overlay");
      const wrap = document.getElementById("canvasWrap");
      if (ov) {
        draftEl = document.createElement("div");
        draftEl.className = "pin open";
        draftEl.style.left = (px * 100) + "%";
        draftEl.style.top = (py * 100) + "%";
        draftEl.textContent = nextUserId();
        ov.appendChild(draftEl);
      }
      const rect = wrap ? wrap.getBoundingClientRect() : null;
      const cx = rect && rect.width > 20 ? rect.left + px * rect.width : window.innerWidth * 0.45;
      const cy = rect && rect.height > 20 ? rect.top + py * rect.height : window.innerHeight * 0.45;
      openPopover(cx, cy);
    };
    const imgEl = document.getElementById("stageImg");
    if (imgEl && !imgEl.complete) {
      let opened = false;
      const done = () => { if (!opened) { opened = true; openPinDraft(); } };
      imgEl.addEventListener("load", done, { once: true });
      setTimeout(done, 250);
    } else {
      requestAnimationFrame(openPinDraft);
    }
    return;
  }
  const modeCn = currentAppearance === "light" ? "亮色" : "暗色";
  showToast(`已定格当前模拟器${modeCn}画面（${data.image}），直接画框/插图钉批注即可`);
}

init();
initSim();
</script>
